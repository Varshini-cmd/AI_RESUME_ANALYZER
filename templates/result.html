<!DOCTYPE html>
<html>
<head>
    <title>Analysis Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Resume Analysis Result</h1>

    <h2>Resume Score</h2>

    <div class="score-box">
    {{ score }}/100
</div>

    <h2>Detected Skills</h2>

    <ul>
        {% for skill in skills %}
            <li>{{ skill }}</li>
        {% endfor %}
    </ul>

    <h2>Interview Questions</h2>

    <ul>
        {% for question in questions %}
            <li>{{ question }}</li>
        {% endfor %}
    </ul>

</div>

</body>
</html>
